name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Show SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
      - name: Release signing key (repository secret, optional)
        env:
          KEYSTORE_B64: ${{ secrets.TGLASS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tglass.jks"
            echo "TGLASS_KEYSTORE=$RUNNER_TEMP/tglass.jks" >> "$GITHUB_ENV"
          else
            echo "No TGLASS_KEYSTORE_B64 secret: release APK is signed with the runner's debug key."
          fi
      - name: Build APKs
        env:
          TGLASS_KEYSTORE_PASSWORD: ${{ secrets.TGLASS_KEYSTORE_PASSWORD }}
          TGLASS_KEY_ALIAS: ${{ secrets.TGLASS_KEY_ALIAS }}
          TGLASS_KEY_PASSWORD: ${{ secrets.TGLASS_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache assembleDebug assembleRelease --stacktrace
      - name: Publish APK (release + builds branch)
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TGlass.apk
          mkdir -p /tmp/builds && cp TGlass.apk /tmp/builds/
          # R8 mapping, to decode stack traces from the in-app crash reports.
          cp android/app/build/outputs/mapping/release/mapping.txt /tmp/builds/mapping.txt || true
          (cd /tmp/builds && git init -q && git checkout -q -b builds && git add -A \
            && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "TGlass APK from ${{ github.sha }}" \
            && git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" builds)
          # The pre-release is a convenience download; the builds branch above is the source of truth.
          notes="Built from ${{ github.sha }} on ${{ github.ref_name }}"
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build TGlass.apk --clobber && gh release edit latest-build --notes "$notes" \
              || echo "::warning::Could not update the latest-build release"
          else
            gh release create latest-build TGlass.apk --prerelease --target "${{ github.sha }}" --title "TGlass latest build" --notes "$notes" \
              || echo "::warning::Could not create the latest-build release"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tglass-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

  screenshots:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-configuration-cache assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./android/scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/screenshots
      - name: Publish screenshots to the builds branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch builds "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/builds
          rm -rf /tmp/builds/screenshots && cp -r android/screenshots /tmp/builds/screenshots
          cd /tmp/builds && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Screenshots from ${{ github.sha }}" || exit 0
          git push -q origin builds
