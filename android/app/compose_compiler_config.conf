// Compose compiler stability configuration (see app/build.gradle.kts).
// Collections are compared with equals() when a composable's parameter changes instance, instead of by identity:
// the repository hands out freshly built lists whose contents are unchanged very often (chat list, message list, ...),
// and with identity comparison every such row would be recomposed for nothing.
kotlin.collections.*
// App data models (all immutable data classes; see data/Models.kt).
com.abtin.tglass.data.*
